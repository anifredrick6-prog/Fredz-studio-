<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fredz Studio — Admin</title>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <script data-cfasync="false">
    window.CMS_MANUAL_INIT = true;
  </script>
  <script data-cfasync="false" src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script data-cfasync="false">
    fetch('/api/token')
      .then(r => r.json())
      .then(data => {
        if (data.token) {
          window.localStorage.setItem('decap-cms-user', JSON.stringify({
            token: data.token,
            provider: 'github'
          }));
          CMS.init();
        } else {
          document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:red">Token not configured. Add GITHUB_TOKEN to Cloudflare environment variables.</p>';
        }
      })
      .catch(() => {
        document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:red">Failed to load. Check your Cloudflare environment variables.</p>';
      });
  </script>
</body>
</html>
